plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'base'
}

version = '1.0.1'
group = 'jackJackca.teamstatus'

base {
    archivesName = 'teamstatus-neoforge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven {
        url = uri('https://maven.aliyun.com/repository/public/')
    }
    maven {
        url = uri('https://maven.ryanliptak.com/')
    }
    maven {
        url = uri('https://maven.neoforged.net/releases/')
    }
}

dependencies {
    implementation 'squeek.appleskin:appleskin-neoforge:mc1.21-3.0.9:api'
}

neoForge {
    version = '21.1.228'
    
    mods {
        teamstatus {
            sourceSet sourceSets.main
        }
    }
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            'Specification-Title': 'teamstatus',
            'Specification-Vendor': 'com.example',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': version,
            'Implementation-Vendor': 'com.example',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'NeoForge-Version': '21.1.228',
            'Minecraft-Version': '1.21.1'
        )
    }
}
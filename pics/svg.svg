<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#24273a"/>
    </linearGradient>
    
    <!-- 主体渐变 -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#74b9ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>

  <!-- 连接网络网格底纹/外环 -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- 团队核心节点（三人物简化组合） -->
  <g transform="translate(0, 10)">
    <!-- 左侧成员 -->
    <circle cx="180" cy="210" r="32" fill="url(#accent-grad)"/>
    <path d="M130 300 C130 255, 230 255, 230 300 Z" fill="url(#accent-grad)" opacity="0.85"/>

    <!-- 右侧成员 -->
    <circle cx="332" cy="210" r="32" fill="url(#accent-grad)"/>
    <path d="M282 300 C282 255, 382 255, 382 300 Z" fill="url(#accent-grad)" opacity="0.85"/>

    <!-- 中间主成员 (更突出) -->
    <circle cx="256" cy="170" r="42" fill="url(#primary-grad)"/>
    <path d="M190 280 C190 220, 322 220, 322 280 Z" fill="url(#primary-grad)"/>
  </g>

  <!-- Status / 状态心跳与在线指示点 -->
  <!-- 在线状态点 (绿色高亮) -->
  <circle cx="350" cy="140" r="18" fill="#2ecc71"/>
  <circle cx="350" cy="140" r="28" fill="none" stroke="#2ecc71" stroke-width="4" opacity="0.5"/>

  <!-- 动态状态折线 (Pulse/Status) -->
  <path d="M110 380 L190 380 L215 340 L245 410 L275 360 L295 380 L402 380" 
        fill="none" 
        stroke="url(#primary-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
